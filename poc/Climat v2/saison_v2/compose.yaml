services:
  seasons-wheel:
    build: .
    image: seasons-wheel:local
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      COPERNICUS_CDS_URL: ${COPERNICUS_CDS_URL:-https://cds.climate.copernicus.eu/api}
      COPERNICUS_CDS_KEY: ${COPERNICUS_CDS_KEY:?Définir COPERNICUS_CDS_KEY dans le fichier .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SEASONS_MAX_CONCURRENT: ${SEASONS_MAX_CONCURRENT:-1}
    volumes:
      - seasons-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m

volumes:
  seasons-data:
