[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "empreinte-climatique"
version = "0.1.0"
description = "Empreinte climatique annuelle d'un lieu depuis les réanalyses Copernicus"
requires-python = ">=3.12"
dependencies = [
  "ecmwf-datastores-client>=0.5,<1",
  "netCDF4>=1.7,<2",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "xarray>=2025.1,<2027",
]

[project.scripts]
empreinte-climatique = "empreinte_climatique.cli:main"

[tool.setuptools.package-data]
empreinte_climatique = ["templates/*.html"]
