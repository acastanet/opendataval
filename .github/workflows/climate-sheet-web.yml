name: Climate sheet web

on:
  pull_request:
    paths:
      - "apps/climate-sheet-service/**"
      - "apps/climate-commentary-service/**"
      - "apps/climate-overview-service/**"
      - "apps/climate-fingerprint-service/**"
      - "apps/climate-seasons-service/**"
      - "apps/climate-water-service/**"
      - "apps/web/src/pages/climat/**"
      - "apps/web/public/climat/**"
      - "doc/climat/validations/data/thermal-seasons-v4/**"
      - ".github/workflows/climate-sheet-web.yml"
  push:
    branches: [master]
    paths:
      - "apps/climate-sheet-service/**"
      - "apps/climate-commentary-service/**"
      - "apps/climate-overview-service/**"
      - "apps/climate-fingerprint-service/**"
      - "apps/climate-seasons-service/**"
      - "apps/climate-water-service/**"
      - "apps/web/src/pages/climat/**"
      - "apps/web/public/climat/**"
      - "doc/climat/validations/data/thermal-seasons-v4/**"
      - ".github/workflows/climate-sheet-web.yml"

permissions:
  contents: read

jobs:
  test:
    name: Static climate sheet
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check climate sheet assembler
        run: python -m py_compile apps/climate-sheet-service/scripts/build_static_sheet.py

      - name: Reject stale V1 commentary
        run: |
          if python apps/climate-sheet-service/scripts/build_static_sheet.py \
            --commentary apps/climate-commentary-service/tests/fixtures/sheet-commentary.golden.json \
            --output-dir /tmp/climate-sheet-stale; then
            echo "Le commentaire V1 aurait dû être refusé" >&2
            exit 1
          fi

      - name: Generate climate sheet with V4-compatible commentary
        run: |
          python apps/climate-sheet-service/scripts/build_static_sheet.py \
            --commentary apps/climate-sheet-service/tests/fixtures/sheet-commentary-v4.integration.json

      - name: Verify generated sheet assets
        run: |
          test -s apps/web/public/climat/generated/climate-overview-v1-neutral.svg
          test -s apps/web/public/climat/generated/climate-fingerprint-v4-neutral.svg
          test -s apps/web/public/climat/generated/thermal-seasons-v4.json
          test -s apps/web/public/climat/generated/water-through-year-v1-neutral.svg
          test -s apps/web/public/climat/generated/climate-commentary.json
          test -s apps/web/public/climat/generated/manifest.json
          grep -q '"version": "4.0.0"' apps/web/public/climat/generated/thermal-seasons-v4.json
          grep -q '"asset": "thermal-seasons-v4.json"' apps/web/public/climat/generated/manifest.json
          grep -q '"commentary": "climate-commentary.json"' apps/web/public/climat/generated/manifest.json
          grep -q '"id": "thermal-seasons", "version": "4.0.0"' apps/web/public/climat/generated/climate-commentary.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm build:web
