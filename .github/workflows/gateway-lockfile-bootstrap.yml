name: Gateway lockfile bootstrap

on:
  push:
    branches:
      - agent/gateway-service-foundation

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la branche
        uses: actions/checkout@v4
        with:
          ref: agent/gateway-service-foundation

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Régénérer le lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Publier le lockfile modifié
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Le lockfile est déjà synchronisé."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build(gateway): synchronise le lockfile"
          git push origin HEAD:agent/gateway-service-foundation
