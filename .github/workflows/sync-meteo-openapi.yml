name: Synchronisation temporaire OpenAPI

on:
  push:
    branches:
      - feat/meteo-station-diagnostics
    paths:
      - "doc/meteo-v2/**"
      - ".github/workflows/sync-meteo-openapi.yml"

permissions:
  contents: write

jobs:
  sync:
    name: Régénère et commit le client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meteo-station-diagnostics
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent
      - run: pnpm --filter meteo-web run generate:api
      - name: Commit du client généré
        run: |
          if git diff --quiet -- apps/meteo-web/src/api/schema.d.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/meteo-web/src/api/schema.d.ts
          git commit -m "chore(meteo): synchronise le client OpenAPI"
          git push origin HEAD:feat/meteo-station-diagnostics
