name: Gateway test diagnostic

on:
  push:
    branches:
      - agent/gateway-service-foundation

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gateway-service-foundation
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Capturer les tests gateway
        shell: bash
        run: |
          set +e
          pnpm --filter gateway-service test > gateway-test-diagnostic.log 2>&1
          status=$?
          printf '\nEXIT_STATUS=%s\n' "$status" >> gateway-test-diagnostic.log
          exit 0
      - name: Publier le diagnostic sur la branche
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gateway-test-diagnostic.log
          git commit -m "test(gateway): publie le diagnostic temporaire"
          git push origin HEAD:agent/gateway-service-foundation
