name: Météo V2

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/gateway-service/**"
      - "apps/geography-service/**"
      - "apps/weather-service/**"
      - "services/weather-vigilance/**"
      - "apps/meteo-web/**"
      - "apps/web/**"
      - "apps/worker/**"
      - "doc/**"
      - "packages/shared/**"
      - "scripts/**"
      - "Dockerfile.caddy"
      - "Caddyfile"
      - "docker-compose.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/meteo-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meteo-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.10.0
  NODE_VERSION: 22

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Tests API
        run: pnpm --filter api test
      - name: Typage API
        run: pnpm --filter api exec tsc --noEmit
      - name: Syntaxe de la sonde nationale
        run: node --check scripts/verify-meteo-national.mjs

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Tests gateway
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter gateway-service test 2>&1 | tee gateway-test.log
      - name: Typage gateway
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter gateway-service typecheck 2>&1 | tee gateway-typecheck.log
      - name: Publier les diagnostics gateway
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-diagnostics
          path: |
            gateway-test.log
            gateway-typecheck.log
          if-no-files-found: warn

  geography:
    name: Geography Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile --reporter=silent
      - run: pnpm --filter geography-service test
      - run: pnpm --filter geography-service typecheck

  weather:
    name: Weather Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile --reporter=silent
      - run: pnpm check:weather

  vigilance:
    name: Weather Vigilance Service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/weather-vigilance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  worker:
    name: Worker météo
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile --reporter=silent
      - run: pnpm --filter worker test
      - run: pnpm --filter worker exec tsc --noEmit

  contract:
    name: Contrat OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile --reporter=silent
      - run: pnpm --filter meteo-web run generate:api
      - name: Publier le client généré
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: meteo-openapi-client, path: apps/meteo-web/src/api/schema.d.ts, if-no-files-found: error }
      - run: git diff -- apps/meteo-web/src/api/schema.d.ts
      - run: git diff --exit-code -- apps/meteo-web/src/api/schema.d.ts

  frontend:
    name: Interface Météo V2
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile --reporter=silent
      - run: pnpm --filter meteo-web test
      - run: pnpm --filter meteo-web build

  containers:
    name: Images de déploiement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file apps/api/Dockerfile --tag opendataval-api:test .
      - run: docker build --file apps/gateway-service/Dockerfile --tag opendataval-gateway:test .
      - run: docker build --file apps/geography-service/Dockerfile --tag opendataval-geography:test .
      - run: docker build --file apps/weather-service/Dockerfile --tag opendataval-weather:test .
      - run: docker build --file services/weather-vigilance/Dockerfile --tag opendataval-vigilance:test .
      - run: docker build --file apps/worker/Dockerfile --tag opendataval-worker:test .
      - run: docker build --file Dockerfile.caddy --tag opendataval-caddy:test .
      - name: Vérifier l’embarquement de Météo V2
        run: >-
          docker run --rm opendataval-caddy:test sh -ec
          'test -f /srv/meteo-v2/index.html;
          test -d /srv/meteo-v2/assets;
          grep -q "/meteo-v2/" /srv/meteo-v2/index.html'
