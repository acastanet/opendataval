name: Météo V2

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/gateway-service/**"
      - "apps/meteo-web/**"
      - "apps/web/**"
      - "apps/worker/**"
      - "doc/ARCHITECTURE-GATEWAY-SERVICE.md"
      - "doc/meteo-v2/**"
      - "packages/shared/**"
      - "scripts/**"
      - "Dockerfile.caddy"
      - "Caddyfile"
      - "docker-compose.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/meteo-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meteo-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.10.0
  NODE_VERSION: 22

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Tests API
        run: pnpm --filter api test
      - name: Typage API
        run: pnpm --filter api exec tsc --noEmit
      - name: Syntaxe de la sonde nationale
        run: node --check scripts/verify-meteo-national.mjs

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Tests gateway
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter gateway-service test 2>&1 | tee gateway-test.log
      - name: Typage gateway
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter gateway-service typecheck 2>&1 | tee gateway-typecheck.log
      - name: Publier les diagnostics gateway
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-diagnostics
          path: |
            gateway-test.log
            gateway-typecheck.log
          if-no-files-found: warn

  worker:
    name: Worker météo
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Tests worker
        run: pnpm --filter worker test
      - name: Typage worker
        run: pnpm --filter worker exec tsc --noEmit

  contract:
    name: Contrat OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Régénérer le client OpenAPI
        run: pnpm --filter meteo-web run generate:api
      - name: Publier le client généré
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteo-openapi-client
          path: apps/meteo-web/src/api/schema.d.ts
          if-no-files-found: error
      - name: Afficher le diff éventuel
        run: git diff -- apps/meteo-web/src/api/schema.d.ts
      - name: Vérifier la synchronisation
        run: git diff --exit-code -- apps/meteo-web/src/api/schema.d.ts

  frontend:
    name: Interface Météo V2
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Tests frontend
        run: pnpm --filter meteo-web test
      - name: Build frontend
        run: pnpm --filter meteo-web build

  containers:
    name: Images de déploiement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Construire l’image API
        run: docker build --file apps/api/Dockerfile --tag opendataval-api:test .
      - name: Construire l’image gateway
        run: docker build --file apps/gateway-service/Dockerfile --tag opendataval-gateway:test .
      - name: Construire l’image worker
        run: docker build --file apps/worker/Dockerfile --tag opendataval-worker:test .
      - name: Construire l’image Caddy
        run: docker build --file Dockerfile.caddy --tag opendataval-caddy:test .
      - name: Vérifier l’embarquement de Météo V2
        run: >-
          docker run --rm opendataval-caddy:test sh -ec
          'test -f /srv/meteo-v2/index.html;
          test -d /srv/meteo-v2/assets;
          grep -q "/meteo-v2/" /srv/meteo-v2/index.html'
