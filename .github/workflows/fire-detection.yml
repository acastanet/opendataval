name: Fire Detection Service

on:
  pull_request:
    paths:
      - "services/fire-detection/**"
      - "apps/gateway-service/**"
      - "doc/architecture/lot-5-fire-detection.md"
      - "doc/adr/ADR-fire-detection-stateless.md"
      - "doc/microservice/fire-detection/**"
      - "docker-compose.yml"
      - "package.json"
      - ".github/workflows/fire-detection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fire-detection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.10.0
  NODE_VERSION: 22

jobs:
  service:
    name: Service et contrat
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Installer le service
        run: npm install --prefix services/fire-detection
      - name: TypeScript du service
        run: npm --prefix services/fire-detection run typecheck
      - name: Tests du service
        run: npm --prefix services/fire-detection test
      - name: Contrat OpenAPI
        run: test -s services/fire-detection/openapi.yaml

  gateway:
    name: Intégration gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Installer le monorepo
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: TypeScript du gateway
        run: pnpm --filter gateway-service typecheck
      - name: Tests du gateway
        run: pnpm --filter gateway-service test

  container:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build --file services/fire-detection/Dockerfile --tag opendataval-fire-detection:test .
      - name: Valider Compose
        run: POSTGRES_PASSWORD=ci-validation docker compose config --quiet
