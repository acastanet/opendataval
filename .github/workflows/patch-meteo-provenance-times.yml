name: Clarification temporaire des heures météo

on:
  push:
    branches:
      - feat/meteo-station-diagnostics
    paths:
      - ".github/workflows/patch-meteo-provenance-times.yml"

permissions:
  contents: write

jobs:
  patch:
    name: Qualifie validité, production et récupération
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meteo-station-diagnostics
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Mettre à jour la présentation et les tests
        run: |
          python - <<'PY'
          from pathlib import Path

          panel_path = Path("apps/meteo-web/src/components/DataProvenancePanel.tsx")
          panel = panel_path.read_text()
          old_time_helpers = '''function valueTime(value: WeatherProvenance["values"][keyof WeatherProvenance["values"]]): string | null {
            return value.time.observedAt
              ?? value.time.validAt
              ?? value.time.generatedAt
              ?? value.time.retrievedAt;
          }

          function timeDescription(
            value: WeatherProvenance["values"][keyof WeatherProvenance["values"]],
          ): string | null {
            const iso = valueTime(value);
            if (!iso) return null;
            if (value.time.observedAt) return `Observée ${formatDateTime(iso)}`;
            if (value.time.validAt) return `Valable ${formatDateTime(iso)}`;
            if (value.time.generatedAt) return `Produite ${formatDateTime(iso)}`;
            return `Récupérée ${formatDateTime(iso)}`;
          }
          '''
          new_time_helpers = '''type ProvenanceValue = WeatherProvenance["values"][keyof WeatherProvenance["values"]];

          interface TimeFact {
            label: string;
            iso: string;
          }

          function validTimeLabel(value: ProvenanceValue): string {
            switch (value.nature) {
              case "official":
                return "Valable jusqu’au";
              case "model":
              case "fallback":
                return "Prévision valable pour";
              case "derived":
                return "Calcul valable pour";
              default:
                return "Valeur valable pour";
            }
          }

          function generatedTimeLabel(value: ProvenanceValue): string {
            switch (value.nature) {
              case "official":
                return "Bulletin produit";
              case "model":
                return "Modèle produit";
              case "derived":
                return "Calcul produit";
              default:
                return "Donnée produite";
            }
          }

          function timeFacts(value: ProvenanceValue): TimeFact[] {
            const facts: TimeFact[] = [];
            if (value.time.observedAt) {
              facts.push({ label: "Observation effectuée", iso: value.time.observedAt });
            }
            if (value.time.validAt) {
              facts.push({ label: validTimeLabel(value), iso: value.time.validAt });
            }
            if (value.time.generatedAt) {
              facts.push({ label: generatedTimeLabel(value), iso: value.time.generatedAt });
            }
            if (value.time.retrievedAt) {
              facts.push({ label: "Récupérée par OpenDataVal", iso: value.time.retrievedAt });
            }
            return facts;
          }

          function ProvenanceTimes({ value, label }: { value: ProvenanceValue; label: string }) {
            const facts = timeFacts(value);
            if (facts.length === 0) return null;

            return (
              <dl className="provenance-times" aria-label={`Horodatage — ${label}`}>
                {facts.map((fact) => (
                  <div key={`${fact.label}-${fact.iso}`}>
                    <dt>{fact.label}</dt>
                    <dd>{formatDateTime(fact.iso)}</dd>
                  </div>
                ))}
              </dl>
            );
          }
          '''
          if old_time_helpers not in panel:
            raise SystemExit("time helper block not found")
          panel = panel.replace(old_time_helpers, new_time_helpers, 1)
          replacements = {
            '{timeDescription(temperature) ? <p>{timeDescription(temperature)}</p> : null}': '<ProvenanceTimes value={temperature} label="température" />',
            '{timeDescription(forecast) ? <p>{timeDescription(forecast)}</p> : null}': '<ProvenanceTimes value={forecast} label="prévisions" />',
            '{timeDescription(alert) ? <p>{timeDescription(alert)}</p> : null}': '<ProvenanceTimes value={alert} label="vigilance" />',
          }
          for old, new in replacements.items():
            if old not in panel:
              raise SystemExit(f"render marker not found: {old}")
            panel = panel.replace(old, new, 1)
          panel_path.write_text(panel)

          css_path = Path("apps/meteo-web/src/provenance.css")
          css = css_path.read_text()
          marker = '''.station-selection-section {
            gap: 0.7rem !important;
          }
          '''
          time_styles = '''.provenance-grid .provenance-times {
            grid-template-columns: 1fr;
            gap: 0.35rem;
            margin-top: 0.15rem;
            padding-top: 0.55rem;
            border-top: 1px solid var(--line);
          }

          .provenance-times div {
            grid-template-columns: minmax(8.5rem, 0.9fr) minmax(0, 1.1fr);
            align-items: baseline;
            gap: 0.5rem;
          }

          .provenance-times dd {
            text-align: right;
          }

          ''' + marker
          if marker not in css:
            raise SystemExit("CSS station marker not found")
          css = css.replace(marker, time_styles, 1)
          mobile_marker = '''  .provenance-grid .selection-counts {
              grid-template-columns: 1fr;
            }
          '''
          mobile_times = '''  .provenance-times div {
              grid-template-columns: 1fr;
              gap: 0.1rem;
            }

            .provenance-times dd {
              text-align: left;
            }

          ''' + mobile_marker
          if mobile_marker not in css:
            raise SystemExit("CSS mobile marker not found")
          css_path.write_text(css.replace(mobile_marker, mobile_times, 1))

          panel_test_path = Path("apps/meteo-web/src/components/DataProvenancePanel.test.tsx")
          panel_test = panel_test_path.read_text()
          old_import = 'import { cleanup, fireEvent, render, screen } from "@testing-library/react";'
          new_import = 'import { cleanup, fireEvent, render, screen, within } from "@testing-library/react";'
          if old_import not in panel_test:
            raise SystemExit("testing library import not found")
          panel_test = panel_test.replace(old_import, new_import, 1)
          test_marker = '''  it("reste lisible pendant une transition avec une réponse de provenance 1.0", () => {
          '''
          new_test = '''  it("distingue la validité, la production et la récupération", () => {
            const provenance = rejectedStationProvenance();
            provenance.values.currentTemperature = {
              ...provenance.values.currentTemperature,
              time: {
                observedAt: null,
                validAt: "2026-07-22T17:00:00.000Z",
                generatedAt: "2026-07-22T15:00:00.000Z",
                retrievedAt: "2026-07-22T17:15:00.000Z",
              },
            };
            provenance.values.alert = {
              ...provenance.values.alert,
              time: {
                observedAt: null,
                validAt: "2026-07-23T04:00:00.000Z",
                generatedAt: "2026-07-22T16:00:00.000Z",
                retrievedAt: "2026-07-22T17:15:00.000Z",
              },
            };

            render(<DataProvenancePanel provenance={provenance} />);
            fireEvent.click(screen.getByText("D’où viennent ces données ?"));

            const temperatureSection = screen.getByText("Température", { selector: ".eyebrow" }).closest("section");
            expect(temperatureSection).not.toBeNull();
            const temperatureTimes = within(temperatureSection as HTMLElement);
            expect(temperatureTimes.getByText("Prévision valable pour")).toBeInTheDocument();
            expect(temperatureTimes.getByText("Modèle produit")).toBeInTheDocument();
            expect(temperatureTimes.getByText("Récupérée par OpenDataVal")).toBeInTheDocument();
            expect(temperatureTimes.getByText("mer. 19 h 00")).toBeInTheDocument();
            expect(temperatureTimes.getByText("mer. 17 h 00")).toBeInTheDocument();
            expect(temperatureTimes.getByText("mer. 19 h 15")).toBeInTheDocument();

            const alertSection = screen.getByText("Vigilance", { selector: ".eyebrow" }).closest("section");
            expect(alertSection).not.toBeNull();
            const alertTimes = within(alertSection as HTMLElement);
            expect(alertTimes.getByText("Valable jusqu’au")).toBeInTheDocument();
            expect(alertTimes.getByText("Bulletin produit")).toBeInTheDocument();
            expect(alertTimes.getByText("Récupérée par OpenDataVal")).toBeInTheDocument();
          });

          ''' + test_marker
          if test_marker not in panel_test:
            raise SystemExit("panel test insertion marker not found")
          panel_test_path.write_text(panel_test.replace(test_marker, new_test, 1))

          app_test_path = Path("apps/meteo-web/src/App.test.tsx")
          app_test = app_test_path.read_text()
          default_marker = '''    expect(screen.getByText(/station Infoclimat Valleraugue/)).toBeInTheDocument();
          '''
          default_replacement = default_marker + '''    expect(screen.getByText(/Température mesurée.+· observation /)).toBeInTheDocument();
          '''
          if default_marker not in app_test:
            raise SystemExit("default source assertion marker not found")
          app_test = app_test.replace(default_marker, default_replacement, 1)
          marseille_marker = '''    expect(screen.getAllByText("Prévision modélisée")).toHaveLength(1);
          '''
          marseille_replacement = marseille_marker + '''    expect(screen.getByText(/AROME HD via Open-Meteo · prévision valable /)).toBeInTheDocument();
          '''
          if marseille_marker not in app_test:
            raise SystemExit("Marseille assertion marker not found")
          app_test_path.write_text(app_test.replace(marseille_marker, marseille_replacement, 1))
          PY
      - name: Valider l’interface
        run: |
          pnpm --filter meteo-web test
          pnpm --filter meteo-web build
      - name: Commit des ajustements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-meteo-provenance-times.yml
          git add apps/meteo-web/src/components/DataProvenancePanel.tsx apps/meteo-web/src/components/DataProvenancePanel.test.tsx apps/meteo-web/src/provenance.css apps/meteo-web/src/App.test.tsx
          git commit -m "refactor(meteo-web): distingue les heures de provenance"
          git push origin HEAD:feat/meteo-station-diagnostics
