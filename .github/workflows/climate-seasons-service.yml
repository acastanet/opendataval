name: Climate seasons service

on:
  pull_request:
    paths:
      - "apps/climate-seasons-service/**"
      - "packages/climate-contracts/**"
      - "doc/climat/methods/thermal-seasons/**"
      - "poc/climat/saisons/**"
      - ".github/workflows/climate-seasons-service.yml"
  push:
    branches:
      - master
    paths:
      - "apps/climate-seasons-service/**"
      - "packages/climate-contracts/**"
      - "doc/climat/methods/thermal-seasons/**"
      - "poc/climat/saisons/**"
      - ".github/workflows/climate-seasons-service.yml"

permissions:
  contents: read

jobs:
  test:
    name: Native thermal seasons P6
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/climate-seasons-service/requirements-test.txt

      - name: Install dependencies
        run: python -m pip install -r apps/climate-seasons-service/requirements-test.txt

      - name: Run native service tests
        run: python -m unittest discover -s apps/climate-seasons-service/tests -p "test_*.py" -v

      - name: Check local replay tool
        run: python -m py_compile apps/climate-seasons-service/scripts/verify_golden_replay.py
