name: Map Style Migration

on:
  push:
    branches:
      - agent/map-service-representation
    paths:
      - "scripts/migrate-map-styles.mjs"
      - ".github/workflows/map-style-migration.yml"

permissions:
  contents: write

env:
  PNPM_VERSION: 11.10.0
  NODE_VERSION: 22

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/map-service-representation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Appliquer la migration des styles
        run: node scripts/migrate-map-styles.mjs
      - name: Vérifier le résultat
        run: |
          pnpm check:map
          pnpm --filter api exec tsc --noEmit
          pnpm build:web
          pnpm check:gateway
      - name: Enregistrer les îlots validés
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/islands
          git commit -m "refactor(map): branche les îlots sur les styles nommés"
          git push origin HEAD:agent/map-service-representation
