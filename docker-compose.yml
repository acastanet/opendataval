services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opendata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-opendata_vda}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opendata} -d ${POSTGRES_DB:-opendata_vda}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-opendata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-opendata_vda}
      METEOFRANCE_API_TOKEN: ${METEOFRANCE_API_TOKEN:-}
      METEOFRANCE_API_TOKEN_VIGILANCE: ${METEOFRANCE_API_TOKEN_VIGILANCE:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-opendata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-opendata_vda}
      METEOFRANCE_API_TOKEN: ${METEOFRANCE_API_TOKEN:-}
      INFOCLIMAT_API_TOKEN: ${INFOCLIMAT_API_TOKEN:-}
      NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY:-}
      COPERNICUS_CDS_URL: ${COPERNICUS_CDS_URL:-https://cds.climate.copernicus.eu/api}
      COPERNICUS_CDS_KEY: ${COPERNICUS_CDS_KEY:-}
      FIRE_RISK_GARD_FALLBACK_DIR: /app/data/incendies
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/incendies:/app/data/incendies:ro

  copernicus:
    profiles: ["copernicus"]
    build:
      context: .
      dockerfile: apps/copernicus/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-opendata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-opendata_vda}
      COPERNICUS_CDS_URL: ${COPERNICUS_CDS_URL:-https://cds.climate.copernicus.eu/api}
      COPERNICUS_CDS_KEY: ${COPERNICUS_CDS_KEY:-}
      COPERNICUS_PRODUCT_TYPE: ${COPERNICUS_PRODUCT_TYPE:-intermediate_dataset}
      COPERNICUS_DOWNLOAD_DIR: /app/data/downloads
      RUN_ONCE: ${COPERNICUS_RUN_ONCE:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/downloads:/app/data/downloads

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "8080:80"
    depends_on:
      - api
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Extraits de relief 3D servis en statique (URL /relief/*.pmtiles) : montés depuis
      # l'hôte plutôt qu'embarqués dans l'image (cf. .dockerignore). ~2 Go, régénérables.
      # Montés fichier par fichier (et non le dossier entier) pour ne pas masquer la page
      # buildée /srv/relief/index.html — sinon la route /relief renvoie 404.
      - ./apps/web/public/relief/aigoual.pmtiles:/srv/relief/aigoual.pmtiles:ro
      - ./apps/web/public/relief/aigoual-hd.pmtiles:/srv/relief/aigoual-hd.pmtiles:ro

volumes:
  db_data:
  caddy_data:
  caddy_config:
