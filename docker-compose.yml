services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opendata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-opendata_vda}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opendata} -d ${POSTGRES_DB:-opendata_vda}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-opendata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-opendata_vda}
      METEOFRANCE_API_TOKEN: ${METEOFRANCE_API_TOKEN:-}
      METEOFRANCE_API_TOKEN_VIGILANCE: ${METEOFRANCE_API_TOKEN_VIGILANCE:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  gateway:
    build:
      context: .
      dockerfile: apps/gateway-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      LEGACY_API_URL: http://api:3000
      GATEWAY_UPSTREAM_TIMEOUT_MS: ${GATEWAY_UPSTREAM_TIMEOUT_MS:-5000}
      GEOGRAPHY_SERVICE_URL: http://geography-service:3000
      GEOGRAPHY_SERVICE_TIMEOUT_MS: ${GEOGRAPHY_SERVICE_TIMEOUT_MS:-3000}
      WEATHER_SERVICE_URL: http://weather-service:3000
      WEATHER_SERVICE_TIMEOUT_MS: ${WEATHER_SERVICE_TIMEOUT_MS:-3000}
      VIGILANCE_SERVICE_URL: http://weather-vigilance-service:3000
      VIGILANCE_SERVICE_TIMEOUT_MS: ${VIGILANCE_SERVICE_TIMEOUT_MS:-3000}
      APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      - api
      - geography-service
      - weather-service
      - weather-vigilance-service
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  geography-service:
    build:
      context: .
      dockerfile: apps/geography-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      TERRITORY_UPSTREAM_URL: ${TERRITORY_UPSTREAM_URL:-https://geo.api.gouv.fr}
      REVERSE_GEOCODING_UPSTREAM_URL: ${REVERSE_GEOCODING_UPSTREAM_URL:-https://data.geopf.fr/geocodage}
      ELEVATION_UPSTREAM_URL: ${ELEVATION_UPSTREAM_URL:-https://data.geopf.fr/altimetrie/1.0/calcul/alti/rest/elevation.json}
      TERRITORY_TIMEOUT_MS: ${TERRITORY_TIMEOUT_MS:-2000}
      REVERSE_GEOCODING_TIMEOUT_MS: ${REVERSE_GEOCODING_TIMEOUT_MS:-2000}
      ELEVATION_TIMEOUT_MS: ${ELEVATION_TIMEOUT_MS:-2000}
      GEOGRAPHY_GLOBAL_TIMEOUT_MS: ${GEOGRAPHY_GLOBAL_TIMEOUT_MS:-2500}
      APP_VERSION: ${APP_VERSION:-dev}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  weather-service:
    build:
      context: .
      dockerfile: apps/weather-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-opendata}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini dans .env}@db:5432/${POSTGRES_DB:-opendata_vda}
      GEOGRAPHY_SERVICE_URL: http://geography-service:3000
      WEATHER_MODEL_URL: ${WEATHER_MODEL_URL:-https://api.open-meteo.com/v1/meteofrance}
      GEOGRAPHY_TIMEOUT_MS: ${GEOGRAPHY_TIMEOUT_MS:-1500}
      DATABASE_TIMEOUT_MS: ${DATABASE_TIMEOUT_MS:-1000}
      WEATHER_MODEL_TIMEOUT_MS: ${WEATHER_MODEL_TIMEOUT_MS:-2000}
      WEATHER_GLOBAL_TIMEOUT_MS: ${WEATHER_GLOBAL_TIMEOUT_MS:-2500}
      APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      db:
        condition: service_healthy
      geography-service:
        condition: service_started
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  weather-vigilance-service:
    build:
      context: .
      dockerfile: services/weather-vigilance/Dockerfile
    image: opendataval-vigilance:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      METEOFRANCE_VIGILANCE_API_URL: ${METEOFRANCE_VIGILANCE_API_URL:-https://public-api.meteofrance.fr/public/DPVigilance/v1}
      METEOFRANCE_VIGILANCE_API_TOKEN: ${METEOFRANCE_VIGILANCE_API_TOKEN:-}
      METEOFRANCE_API_TOKEN_VIGILANCE: ${METEOFRANCE_API_TOKEN_VIGILANCE:-}
      METEOFRANCE_VIGILANCE_AUTH_MODE: ${METEOFRANCE_VIGILANCE_AUTH_MODE:-apikey}
      VIGILANCE_REFRESH_SECONDS: ${VIGILANCE_REFRESH_SECONDS:-300}
      VIGILANCE_STALE_AFTER_SECONDS: ${VIGILANCE_STALE_AFTER_SECONDS:-900}
      VIGILANCE_EXPIRE_AFTER_SECONDS: ${VIGILANCE_EXPIRE_AFTER_SECONDS:-21600}
      VIGILANCE_CONNECT_TIMEOUT_MS: ${VIGILANCE_CONNECT_TIMEOUT_MS:-3000}
      VIGILANCE_READ_TIMEOUT_MS: ${VIGILANCE_READ_TIMEOUT_MS:-10000}
      VIGILANCE_MAX_RETRIES: ${VIGILANCE_MAX_RETRIES:-2}
      VIGILANCE_MAX_RESPONSE_BYTES: ${VIGILANCE_MAX_RESPONSE_BYTES:-5000000}
      VIGILANCE_CIRCUIT_FAILURE_THRESHOLD: ${VIGILANCE_CIRCUIT_FAILURE_THRESHOLD:-3}
      VIGILANCE_CIRCUIT_OPEN_SECONDS: ${VIGILANCE_CIRCUIT_OPEN_SECONDS:-60}
      VIGILANCE_SNAPSHOT_PATH: /app/data/vigilance-snapshot.json
      APP_VERSION: ${APP_VERSION:-dev}
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILT_AT: ${BUILT_AT:-unknown}
    volumes:
      - vigilance_cache:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-opendata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-opendata_vda}
      METEOFRANCE_API_TOKEN: ${METEOFRANCE_API_TOKEN:-}
      METEOFRANCE_STATIONS_API_TOKEN: ${METEOFRANCE_STATIONS_API_TOKEN:-}
      METEOFRANCE_OBS_NATIONAL_API_TOKEN: ${METEOFRANCE_OBS_NATIONAL_API_TOKEN:-}
      INFOCLIMAT_API_TOKEN: ${INFOCLIMAT_API_TOKEN:-}
      NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY:-}
      COPERNICUS_CDS_URL: ${COPERNICUS_CDS_URL:-https://cds.climate.copernicus.eu/api}
      COPERNICUS_CDS_KEY: ${COPERNICUS_CDS_KEY:-}
      FIRE_RISK_GARD_FALLBACK_DIR: /app/data/incendies
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/incendies:/app/data/incendies:ro

  copernicus:
    profiles: ["copernicus"]
    build:
      context: .
      dockerfile: apps/copernicus/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-opendata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-opendata_vda}
      COPERNICUS_CDS_URL: ${COPERNICUS_CDS_URL:-https://cds.climate.copernicus.eu/api}
      COPERNICUS_CDS_KEY: ${COPERNICUS_CDS_KEY:-}
      COPERNICUS_PRODUCT_TYPE: ${COPERNICUS_PRODUCT_TYPE:-intermediate_dataset}
      COPERNICUS_DOWNLOAD_DIR: /app/data/downloads
      RUN_ONCE: ${COPERNICUS_RUN_ONCE:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/downloads:/app/data/downloads

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "8080:80"
    # Caddy reste indépendant du nouveau gateway afin que les routes historiques
    # et les fichiers statiques restent disponibles même si le gateway échoue.
    depends_on:
      api:
        condition: service_started
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Extraits de relief 3D servis en statique (URL /relief/*.pmtiles) : montés depuis
      # l'hôte plutôt qu'embarqués dans l'image (cf. .dockerignore). ~2 Go, régénérables.
      # Montés fichier par fichier (et non le dossier entier) pour ne pas masquer la page
      # buildée /srv/relief/index.html — sinon la route /relief renvoie 404.
      - ./apps/web/public/relief/aigoual.pmtiles:/srv/relief/aigoual.pmtiles:ro
      - ./apps/web/public/relief/aigoual-hd.pmtiles:/srv/relief/aigoual-hd.pmtiles:ro

volumes:
  db_data:
  caddy_data:
  caddy_config:
  vigilance_cache:
