services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opendata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-opendata_vda}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opendata} -d ${POSTGRES_DB:-opendata_vda}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-opendata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-opendata_vda}
      METEOFRANCE_API_TOKEN: ${METEOFRANCE_API_TOKEN:-}
      METEOFRANCE_API_TOKEN_VIGILANCE: ${METEOFRANCE_API_TOKEN_VIGILANCE:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  gateway:
    build:
      context: .
      dockerfile: apps/gateway-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      LEGACY_API_URL: http://api:3000
      GATEWAY_UPSTREAM_TIMEOUT_MS: ${GATEWAY_UPSTREAM_TIMEOUT_MS:-5000}
      GEOGRAPHY_SERVICE_URL: http://geography-service:3000
      GEOGRAPHY_SERVICE_TIMEOUT_MS: ${GEOGRAPHY_SERVICE_TIMEOUT_MS:-3000}
      WEATHER_SERVICE_URL: http://weather-service:3000
      WEATHER_SERVICE_TIMEOUT_MS: ${WEATHER_SERVICE_TIMEOUT_MS:-3000}
      VIGILANCE_SERVICE_URL: http://weather-vigilance-service:3000
      VIGILANCE_SERVICE_TIMEOUT_MS: ${VIGILANCE_SERVICE_TIMEOUT_MS:-3000}
      FIRE_DETECTION_SERVICE_URL: http://fire-detection-service:3000
      FIRE_DETECTION_SERVICE_TIMEOUT_MS: ${FIRE_DETECTION_SERVICE_TIMEOUT_MS:-20000}
      ASSOCIATION_SERVICE_URL: http://association-service:3000
      ASSOCIATION_SERVICE_TIMEOUT_MS: ${ASSOCIATION_SERVICE_TIMEOUT_MS:-5000}
      OLD_SERVICE_URL: http://old-service:3000
      OLD_SERVICE_TIMEOUT_MS: ${OLD_SERVICE_TIMEOUT_MS:-15000}
      ITINERAIRE_SERVICE_URL: http://itineraire-service:3000
      ITINERAIRE_SERVICE_TIMEOUT_MS: ${ITINERAIRE_SERVICE_TIMEOUT_MS:-30000}
      MAP_SERVICE_URL: http://map-service:3000
      APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      - api
      - geography-service
      - weather-service
      - weather-vigilance-service
      - fire-detection-service
      - association-service
      - old-service
      - itineraire-service
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  geography-service:
    build:
      context: .
      dockerfile: apps/geography-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      TERRITORY_UPSTREAM_URL: ${TERRITORY_UPSTREAM_URL:-https://geo.api.gouv.fr}
      REVERSE_GEOCODING_UPSTREAM_URL: ${REVERSE_GEOCODING_UPSTREAM_URL:-https://data.geopf.fr/geocodage}
      ELEVATION_UPSTREAM_URL: ${ELEVATION_UPSTREAM_URL:-https://data.geopf.fr/altimetrie/1.0/calcul/alti/rest/elevation.json}
      TERRITORY_TIMEOUT_MS: ${TERRITORY_TIMEOUT_MS:-2000}
      REVERSE_GEOCODING_TIMEOUT_MS: ${REVERSE_GEOCODING_TIMEOUT_MS:-2000}
      ELEVATION_TIMEOUT_MS: ${ELEVATION_TIMEOUT_MS:-2000}
      GEOGRAPHY_GLOBAL_TIMEOUT_MS: ${GEOGRAPHY_GLOBAL_TIMEOUT_MS:-2500}
      APP_VERSION: ${APP_VERSION:-dev}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  association-service:
    build:
      context: .
      dockerfile: apps/association-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      ASSOCIATION_DATA_DIR: /var/lib/opendataval/association-service
      RNA_WALDEC_SOURCE_URL: ${RNA_WALDEC_SOURCE_URL:-https://www.data.gouv.fr/api/1/datasets/r/91fd139b-4c2a-4d36-b05b-8607b41f1202}
      RNA_IMPORT_SOURCE_URL: ${RNA_IMPORT_SOURCE_URL:-https://www.data.gouv.fr/api/1/datasets/r/66e052d8-e387-443e-8f43-2916d17022fb}
      RNA_SOURCE_URL: ${RNA_SOURCE_URL:-}
      ASSOCIATION_GEOCODING_URL: ${ASSOCIATION_GEOCODING_URL:-https://data.geopf.fr/geocodage/search}
      ASSOCIATION_SYNC_TOKEN: ${ASSOCIATION_SYNC_TOKEN:-}
      ASSOCIATION_DOWNLOAD_TIMEOUT_MS: ${ASSOCIATION_DOWNLOAD_TIMEOUT_MS:-1800000}
      ASSOCIATION_GEOCODING_TIMEOUT_MS: ${ASSOCIATION_GEOCODING_TIMEOUT_MS:-5000}
      APP_VERSION: ${APP_VERSION:-dev}
    volumes:
      - association_data:/var/lib/opendataval/association-service
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  old-service:
    build:
      context: .
      dockerfile: apps/old-service/Dockerfile
    image: opendataval-old:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      OLD_API_CARTO_URL: ${OLD_API_CARTO_URL:-https://apicarto.ign.fr/api}
      OLD_WFS_URL: ${OLD_WFS_URL:-https://data.geopf.fr/wfs/ows}
      OLD_UPSTREAM_TIMEOUT_MS: ${OLD_UPSTREAM_TIMEOUT_MS:-10000}
      OLD_BUILDING_SEARCH_RADIUS_METERS: ${OLD_BUILDING_SEARCH_RADIUS_METERS:-75}
      APP_VERSION: ${APP_VERSION:-dev}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    restart: unless-stopped
    environment:
      # Corridor continu Doubs ↔ Cévennes via Rhône-Alpes : le script Valhalla accepte une liste
      # d'URL séparées par des espaces et fusionne les PBF avant le build.
      tile_urls: "https://download.openstreetmap.fr/extracts/europe/france/languedoc_roussillon-latest.osm.pbf https://download.openstreetmap.fr/extracts/europe/france/auvergne-latest.osm.pbf https://download.openstreetmap.fr/extracts/europe/france/bourgogne-latest.osm.pbf https://download.openstreetmap.fr/extracts/europe/france/franche_comte-latest.osm.pbf https://download.openstreetmap.fr/extracts/europe/france/rhone_alpes-latest.osm.pbf"
      build_elevation: "False"
      build_admins: "True"
      serve_tiles: "True"
      force_rebuild: "False"
    volumes:
      - valhalla_tiles:/custom_files
    expose:
      - "8002"

  itineraire-service:
    build:
      context: .
      dockerfile: apps/itineraire-service/Dockerfile
    image: opendataval-itineraire:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      VALHALLA_URL: http://valhalla:8002
      VALHALLA_TIMEOUT_MS: ${VALHALLA_TIMEOUT_MS:-25000}
      ITINERAIRE_RESTRICTIONS_FILE: /var/lib/opendataval/itineraire-service/restrictions.json
      ITINERAIRE_OSM_BBOXES: ${ITINERAIRE_OSM_BBOXES:-43.2,2.5,45.0,4.9;44.0,2.0,46.4,4.9;46.0,3.0,48.0,5.5;46.0,5.0,47.0,7.0;47.0,5.0,48.0,7.0;44.0,3.7,45.5,7.5;45.5,3.7,46.7,7.5}
      APP_VERSION: ${APP_VERSION:-dev}
    volumes:
      - itineraire_data:/var/lib/opendataval/itineraire-service
    depends_on:
      - valhalla
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  weather-service:
    build:
      context: .
      dockerfile: apps/weather-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-opendata}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini dans .env}@db:5432/${POSTGRES_DB:-opendata_vda}
      GEOGRAPHY_SERVICE_URL: http://geography-service:3000
      WEATHER_MODEL_URL: ${WEATHER_MODEL_URL:-https://api.open-meteo.com/v1/meteofrance}
      GEOGRAPHY_TIMEOUT_MS: ${GEOGRAPHY_TIMEOUT_MS:-1500}
      DATABASE_TIMEOUT_MS: ${DATABASE_TIMEOUT_MS:-1000}
      WEATHER_MODEL_TIMEOUT_MS: ${WEATHER_MODEL_TIMEOUT_MS:-2000}
      WEATHER_GLOBAL_TIMEOUT_MS: ${WEATHER_GLOBAL_TIMEOUT_MS:-2500}
      APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      db:
        condition: service_healthy
      geography-service:
        condition: service_started
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  map-service:
    build:
      context: .
      dockerfile: apps/map-service/Dockerfile
    image: opendataval-map:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      APP_VERSION: ${APP_VERSION:-dev}
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILT_AT: ${BUILT_AT:-unknown}
      MAP_TILE_CACHE_MAX_BYTES: ${MAP_TILE_CACHE_MAX_BYTES:-268435456}
      MAP_RELIEF_GLOBAL_PATH: /srv/relief/aigoual.pmtiles
      MAP_RELIEF_HD_PATH: /srv/relief/aigoual-hd.pmtiles
    volumes:
      - ./apps/web/public/relief:/srv/relief:ro
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  weather-vigilance-service:
    build:
      context: .
      dockerfile: services/weather-vigilance/Dockerfile
    image: opendataval-vigilance:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      METEOFRANCE_VIGILANCE_API_URL: ${METEOFRANCE_VIGILANCE_API_URL:-https://public-api.meteofrance.fr/public/DPVigilance/v1}
      METEOFRANCE_VIGILANCE_API_TOKEN: ${METEOFRANCE_VIGILANCE_API_TOKEN:-}
      METEOFRANCE_API_TOKEN_VIGILANCE: ${METEOFRANCE_API_TOKEN_VIGILANCE:-}
      METEOFRANCE_VIGILANCE_AUTH_MODE: ${METEOFRANCE_VIGILANCE_AUTH_MODE:-apikey}
      VIGILANCE_REFRESH_SECONDS: ${VIGILANCE_REFRESH_SECONDS:-300}
      VIGILANCE_STALE_AFTER_SECONDS: ${VIGILANCE_STALE_AFTER_SECONDS:-900}
      VIGILANCE_EXPIRE_AFTER_SECONDS: ${VIGILANCE_EXPIRE_AFTER_SECONDS:-21600}
      VIGILANCE_CONNECT_TIMEOUT_MS: ${VIGILANCE_CONNECT_TIMEOUT_MS:-3000}
      VIGILANCE_READ_TIMEOUT_MS: ${VIGILANCE_READ_TIMEOUT_MS:-10000}
      VIGILANCE_MAX_RETRIES: ${VIGILANCE_MAX_RETRIES:-2}
      VIGILANCE_MAX_RESPONSE_BYTES: ${VIGILANCE_MAX_RESPONSE_BYTES:-5000000}
      VIGILANCE_CIRCUIT_FAILURE_THRESHOLD: ${VIGILANCE_CIRCUIT_FAILURE_THRESHOLD:-3}
      VIGILANCE_CIRCUIT_OPEN_SECONDS: ${VIGILANCE_CIRCUIT_OPEN_SECONDS:-60}
      VIGILANCE_SNAPSHOT_PATH: /app/data/vigilance-snapshot.json
      APP_VERSION: ${APP_VERSION:-dev}
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILT_AT: ${BUILT_AT:-unknown}
    volumes:
      - vigilance_cache:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  fire-detection-service:
    build:
      context: .
      dockerfile: services/fire-detection/Dockerfile
    image: opendataval-fire-detection:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY:-}
      FIRMS_API_BASE_URL: ${FIRMS_API_BASE_URL:-https://firms.modaps.eosdis.nasa.gov/api/area/csv}
      FIRMS_TIMEOUT_MS: ${FIRMS_TIMEOUT_MS:-8000}
      FIRMS_MAX_RETRIES: ${FIRMS_MAX_RETRIES:-1}
      EUMETSAT_CONSUMER_KEY: ${EUMETSAT_CONSUMER_KEY:-}
      EUMETSAT_CONSUMER_SECRET: ${EUMETSAT_CONSUMER_SECRET:-}
      EUMETSAT_TOKEN_URL: ${EUMETSAT_TOKEN_URL:-https://api.eumetsat.int/token}
      EUMETSAT_SEARCH_URL: ${EUMETSAT_SEARCH_URL:-https://api.eumetsat.int/data/search-products/1.0.0/os}
      EUMETSAT_BROWSE_URL: ${EUMETSAT_BROWSE_URL:-https://api.eumetsat.int/data/browse}
      EUMETSAT_DOWNLOAD_URL: ${EUMETSAT_DOWNLOAD_URL:-https://api.eumetsat.int/data/download/1.0.0}
      EUMETSAT_MTG_FIRE_COLLECTION: ${EUMETSAT_MTG_FIRE_COLLECTION:-EO:EUM:DAT:0801}
      EUMETSAT_TIMEOUT_MS: ${EUMETSAT_TIMEOUT_MS:-10000}
      EUMETSAT_PAGE_SIZE: ${EUMETSAT_PAGE_SIZE:-100}
      EUMETSAT_MAX_PAGES: ${EUMETSAT_MAX_PAGES:-100}
      EUMETSAT_DOWNLOAD_CONCURRENCY: ${EUMETSAT_DOWNLOAD_CONCURRENCY:-8}
      FIRE_DEFAULT_RADIUS_KM: ${FIRE_DEFAULT_RADIUS_KM:-50}
      FIRE_MAX_RADIUS_KM: ${FIRE_MAX_RADIUS_KM:-100}
      FIRE_HISTORY_DAYS: ${FIRE_HISTORY_DAYS:-7}
      FIRE_REALTIME_WINDOW_MINUTES: ${FIRE_REALTIME_WINDOW_MINUTES:-90}
      FIRE_CACHE_SECONDS: ${FIRE_CACHE_SECONDS:-45}
      FIRE_MAX_RESPONSE_BYTES: ${FIRE_MAX_RESPONSE_BYTES:-5000000}
      APP_VERSION: ${APP_VERSION:-dev}
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILT_AT: ${BUILT_AT:-unknown}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-opendata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-opendata_vda}
      METEOFRANCE_API_TOKEN: ${METEOFRANCE_API_TOKEN:-}
      METEOFRANCE_STATIONS_API_TOKEN: ${METEOFRANCE_STATIONS_API_TOKEN:-}
      METEOFRANCE_OBS_NATIONAL_API_TOKEN: ${METEOFRANCE_OBS_NATIONAL_API_TOKEN:-}
      INFOCLIMAT_API_TOKEN: ${INFOCLIMAT_API_TOKEN:-}
      NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY:-}
      COPERNICUS_CDS_URL: ${COPERNICUS_CDS_URL:-https://cds.climate.copernicus.eu/api}
      COPERNICUS_CDS_KEY: ${COPERNICUS_CDS_KEY:-}
      FIRE_RISK_GARD_FALLBACK_DIR: /app/data/incendies
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/incendies:/app/data/incendies:ro

  copernicus:
    profiles: ["copernicus"]
    build:
      context: .
      dockerfile: apps/copernicus/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-opendata}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit etre defini dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-opendata_vda}
      COPERNICUS_CDS_URL: ${COPERNICUS_CDS_URL:-https://cds.climate.copernicus.eu/api}
      COPERNICUS_CDS_KEY: ${COPERNICUS_CDS_KEY:-}
      COPERNICUS_PRODUCT_TYPE: ${COPERNICUS_PRODUCT_TYPE:-intermediate_dataset}
      COPERNICUS_DOWNLOAD_DIR: /app/data/downloads
      RUN_ONCE: ${COPERNICUS_RUN_ONCE:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/downloads:/app/data/downloads

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "8080:80"
    # Caddy reste indépendant du gateway et du map-service afin que les routes historiques
    # et les fichiers statiques restent disponibles même si un service v2 échoue.
    depends_on:
      api:
        condition: service_started
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./poc/valleraugue-mairie-3d/publication:/srv/valleraugue-3d:ro

volumes:
  db_data:
  caddy_data:
  caddy_config:
  vigilance_cache:
  association_data:
  valhalla_tiles:
  itineraire_data:
