schema_version: "1.0"
id: thermal-seasons
version: "3.0.0"
status: candidate

product:
  title_fr: "Les saisons se déplacent"
  question_fr: "Le calendrier thermique local se déplace-t-il ?"

change_from_v2:
  level: MAJOR
  reason: >-
    Le replay réel de thermal-seasons@2.0.0 a rejeté le candidat : la moyenne
    mobile 31 jours pouvait produire des franchissements multiples et le
    détecteur chronologique retenait un franchissement transitoire comme limite
    saisonnière. V3 conserve les mêmes lissages mais change la définition des
    frontières : elles bornent le régime thermique principal contenant le
    maximum annuel.

periods:
  reference: [1991, 2020]
  study: [1996, 2025]
  early: [1996, 2005]
  middle: [2006, 2015]
  late: [2016, 2025]

input:
  dataset_registry_id: era5-land-timeseries
  dataset_id: reanalysis-era5-land-timeseries
  variable: 2m_temperature
  grid_degrees: 0.1
  timezone: UTC

preprocessing:
  daily_aggregation: hourly_mean_utc
  minimum_hourly_values_per_day: 18
  leap_day: removed
  minimum_year_coverage_fraction: 0.98
  maximum_interpolated_gap_days: 2

thresholds:
  climatology: daily_mean_1991_2020
  t25_percentile: 25
  t75_percentile: 75
  percentile_method: linear

smoothing:
  canonical:
    id: harmonic_2
    model: >-
      c0 + a1*sin(2*pi*t/365) + b1*cos(2*pi*t/365)
      + a2*sin(4*pi*t/365) + b2*cos(4*pi*t/365)
    fit: ordinary_least_squares
    circular: true
  independent_control:
    id: circular_moving_average_31d
    window_days: 31
    centered: true
    circular: true

boundary_detection:
  id: principal_interval_containing_annual_maximum
  annual_peak: maximum_of_smoothed_curve
  t75:
    interval: contiguous_days_ge_t75_containing_annual_peak
    start: summer_start
    end: autumn_start
  t25:
    interval: contiguous_days_ge_t25_containing_annual_peak
    start: spring_start
    end: winter_start
  crossing_interpolation: linear
  required_order: spring_start < summer_start < autumn_start < winter_start
  year_boundary_rule: interval_touching_jan1_or_dec31_is_invalid

qa:
  fit_rmse:
    statistic: rmse_daily_temperature_vs_harmonic_fit
    threshold: reference_year_distribution_p95
    reference_period: [1991, 2020]
    action_above_threshold: annual_status_partial
  smoother_sensitivity:
    metric: maximum_absolute_boundary_difference_between_v3_principal_regimes
    review_threshold_days: 3
    reject_threshold_days: 10
    action_3_to_10_days: annual_status_partial
    action_above_10_days: annual_status_rejected
  next_year_boundary:
    rule: >-
      La durée d'hiver de l'année N n'utilise le printemps N+1 que si le
      régime principal canonique de N+1 a lui-même passé toute la QA V3 avec
      status=ok.
    missing_or_rejected_action: winter_length_null

comparison:
  statistic: median
  minimum_valid_years_per_decade: 8
  eligible_annual_status: ok
  output: late_median_minus_early_median
  statistical_trend_test: null

publication:
  allowed: false
  reason: "Candidat scientifique : replay Copernicus réel V1/V2/V3 et revue explicite requis."

validation_blockers:
  - replay_real_climate_snapshot
  - confirm_v2_false_crossing_failure_is_removed
  - inspect_30_year_rmse_distribution
  - inspect_30_year_principal_regime_sensitivity_distribution
  - confirm_at_least_8_ok_years_in_early_and_late_periods
  - compare_five_decadal_signals_against_v1

project_evidence:
  - doc/climat/validations/thermal-seasons-v2-real-replay.md
  - doc/climat/validations/data/thermal-seasons-v2/thermal-seasons-v1-v2-comparison.json
  - apps/climate-seasons-service/src/climate_seasons_service/principal_regime.py
  - apps/climate-seasons-service/tests/test_v3_candidate.py
