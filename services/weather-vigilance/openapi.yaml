openapi: 3.1.0
info:
  title: OpenDataVal Weather Vigilance Service
  version: 0.1.0
paths:
  /healthz:
    get:
      responses:
        '200': { description: Processus vivant }
  /readyz:
    get:
      responses:
        '200': { description: Snapshot exploitable }
        '503': { description: Aucun snapshot exploitable }
  /version:
    get:
      responses:
        '200': { description: Version du service }
  /v1/vigilance/departments/{departmentCode}:
    get:
      parameters:
        - name: departmentCode
          in: path
          required: true
          schema: { type: string, pattern: '^(?:0[1-9]|[1-8][0-9]|9[0-5]|2A|2B|97[1-6])$' }
        - name: include_bulletins
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Vigilance départementale officielle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VigilanceResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: Erreur structurée
      content:
        application/json:
          schema:
            type: object
            required: [service, data_status, error]
            properties:
              service: { const: weather-vigilance }
              data_status: { const: unavailable }
              freshness_status: { type: string, enum: [fresh, stale, expired, unknown] }
              error:
                type: object
                required: [code, message, retryable]
                properties:
                  code: { type: string }
                  message: { type: string }
                  retryable: { type: boolean }
  schemas:
    Level:
      type: object
      required: [code, rank, label]
      properties:
        code: { type: string, enum: [green, yellow, orange, red, unknown] }
        rank: { type: [integer, 'null'] }
        label: { type: string }
        source_code: { type: string }
    VigilanceResponse:
      type: object
      required: [service, version, data_status, freshness_status, geographic_scope, location, periods, bulletins, source, cache, warnings]
      properties:
        service: { const: weather-vigilance }
        version: { type: string }
        data_status: { const: available }
        freshness_status: { type: string, enum: [fresh, stale, expired, unknown] }
        geographic_scope: { const: department }
        location:
          type: object
          required: [department_code, department_name, resolved_by]
          properties:
            department_code: { type: string }
            department_name: { type: [string, 'null'] }
            resolved_by: { type: string }
        periods:
          type: array
          items:
            type: object
            required: [day, date, overall_level, phenomena, valid_from, valid_until]
            properties:
              day: { type: string, enum: [today, tomorrow, unknown] }
              date: { type: [string, 'null'] }
              overall_level: { $ref: '#/components/schemas/Level' }
              phenomena: { type: array, items: { type: object } }
              valid_from: { type: [string, 'null'], format: date-time }
              valid_until: { type: [string, 'null'], format: date-time }
        bulletins: { type: array, items: { type: object } }
        source: { type: object }
        cache: { type: object }
        warnings: { type: array, items: { type: object } }
