<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Piézomètre — Valleraugue</title>
<style>
  :root {
    --color-ardoise: #2b3238;
    --color-brume: #ededea;
    --color-chataigne: #6b4226;
    --color-torrent: #3e6e82;
    --color-granite: #9a9b93;
    --color-alerte: #b5533c;

    --bg: var(--color-brume);
    --fg: var(--color-ardoise);
    --accent: var(--color-chataigne);
    --border: var(--color-granite);
    --panel-bg: rgba(237, 237, 234, 0.94);
    --shadow: 0 2px 12px rgba(43, 50, 56, 0.14);

    --font-display: "Iowan Old Style", "Palatino Linotype", Georgia, ui-serif, serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;

    --radius: 4px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
  }

  a {
    color: var(--accent);
  }

  button {
    font-family: inherit;
  }

  .fiche {
    position: relative;
    width: min(48rem, 96vw);
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.4rem 1.6rem 1.6rem;
    font-size: 1rem;
    box-shadow: var(--shadow);
  }

  .fiche h3 {
    font-family: var(--font-display);
    margin: 0 0 0.6rem;
    font-size: 1.4rem;
  }

  .fiche dl {
    margin: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.2rem 0.8rem;
    font-family: var(--font-mono);
    font-size: 0.82rem;
  }

  .fiche dt {
    color: var(--border);
  }

  .fiche dd {
    margin: 0;
  }

  .chargement {
    font-size: 0.88rem;
    color: var(--border);
  }

  .chargement.erreur {
    color: var(--color-alerte);
  }

  .stats-chronique {
    margin-top: 0.8rem;
    padding-top: 0.8rem;
    border-top: 1px solid var(--border);
    font-size: 0.88rem;
    line-height: 1.6;
  }

  .stats-chronique p {
    margin: 0.2rem 0;
  }

  .detail {
    color: var(--border);
  }

  .situation {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .pastille-situation {
    width: 0.75rem;
    height: 0.75rem;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .minmax {
    color: var(--border);
    font-size: 0.82rem;
  }

  .graphe {
    width: 100%;
    height: auto;
    margin-top: 0.8rem;
  }

  .legende-graphe {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--border);
    margin: 0.3rem 0 0;
  }

  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6rem;
    margin-top: 0.8rem;
  }

  .actions a {
    font-size: 0.85rem;
  }

  #bouton-actualiser {
    font-size: 0.85rem;
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: transparent;
    color: var(--fg);
    cursor: pointer;
  }

  #bouton-actualiser:hover {
    background: rgba(154, 155, 147, 0.18);
  }

  #bouton-actualiser:disabled {
    opacity: 0.5;
    cursor: default;
  }

  #horodatage {
    margin: 0.5rem 0 0;
    font-size: 0.72rem;
    color: var(--border);
  }
</style>
</head>
<body>
  <div class="fiche" role="dialog" aria-label="Piézomètre de Valleraugue">
    <h3 id="titre">Chargement…</h3>
    <p class="chargement" id="etat-chargement">Chargement…</p>

    <dl id="dl-altitude" hidden>
      <dt>altitude station</dt>
      <dd id="valeur-altitude"></dd>
    </dl>

    <div class="stats-chronique" id="bloc-stats" hidden>
      <p class="derniere-mesure">
        <strong id="niveau-actuel"></strong>
        <span class="detail" id="profondeur-actuelle"></span>
        <span class="detail" id="date-derniere"></span>
      </p>
      <p class="situation" id="bloc-situation" hidden>
        <span class="pastille-situation" id="pastille-situation"></span>
        <span id="texte-situation"></span>
      </p>
      <p class="minmax" id="minmax"></p>
    </div>

    <svg viewBox="0 0 300 130" class="graphe" id="graphe" role="img" aria-label="Évolution du niveau de la nappe" hidden>
      <defs>
        <clipPath id="aire-clip">
          <rect x="38" y="8" width="252" height="92" />
        </clipPath>
      </defs>
      <g id="grille"></g>
      <path id="aire-graphe" fill="var(--color-torrent)" fill-opacity="0.12" stroke="none" clip-path="url(#aire-clip)" />
      <path id="chemin-graphe" fill="none" stroke="var(--color-torrent)" stroke-width="1.6" stroke-linejoin="round" clip-path="url(#aire-clip)" />
      <g id="axes-x" font-family="var(--font-mono)" font-size="9" fill="var(--border)"></g>
      <g id="axes-y" font-family="var(--font-mono)" font-size="9" fill="var(--border)"></g>
      <circle id="dernier-point" r="2.5" fill="var(--color-torrent)" />
    </svg>
    <p class="legende-graphe" id="legende-graphe"></p>

    <div class="actions">
      <a href="https://ades.eaufrance.fr/" target="_blank" rel="noopener">Voir la source →</a>
      <button type="button" id="bouton-actualiser">Actualiser</button>
    </div>
    <p id="horodatage"></p>
  </div>

<script>
  // Code BSS Hub'Eau de la station à afficher — changer cette valeur pour réutiliser la page
  // sur une autre station piézométrique.
  const CODE_BSS = "09364X0017/111111";

  const SEUILS_SITUATION = [
    { max: 0.1, classe: "tres_bas", libelle: "très bas" },
    { max: 0.25, classe: "bas", libelle: "bas" },
    { max: 0.75, classe: "modere", libelle: "modéré" },
    { max: 0.9, classe: "haut", libelle: "haut" },
    { max: Infinity, classe: "tres_haut", libelle: "très haut" },
  ];
  const NB_REFERENCE_MIN = 24;

  const COULEUR_SITUATION = {
    tres_bas: "#b5533c",
    bas: "#c99a3e",
    modere: "var(--border)",
    haut: "#5c7a44",
    tres_haut: "#3e6e82",
  };

  async function fetchAllHubeau(url) {
    const resultats = [];
    let suivant = url;
    while (suivant) {
      const res = await fetch(suivant);
      if (!res.ok) throw new Error(`Hub'Eau ${suivant} → HTTP ${res.status}`);
      const page = await res.json();
      resultats.push(...page.data);
      suivant = page.next;
    }
    return resultats;
  }

  function calculerStats(mesures) {
    if (mesures.length === 0) return null;
    const valides = mesures
      .filter((m) => m.niveau_m_ngf !== null)
      .map((m) => ({
        date: m.date,
        niveau: Number(m.niveau_m_ngf),
        profondeur: m.profondeur_m === null ? null : Number(m.profondeur_m),
      }));
    if (valides.length === 0) return null;

    const derniereMesure = mesures[mesures.length - 1];
    const derniere = {
      date: derniereMesure.date,
      niveau_m_ngf: derniereMesure.niveau_m_ngf === null ? null : Number(derniereMesure.niveau_m_ngf),
      profondeur_m: derniereMesure.profondeur_m === null ? null : Number(derniereMesure.profondeur_m),
    };

    const min = valides.reduce((a, b) => (b.niveau < a.niveau ? b : a));
    const max = valides.reduce((a, b) => (b.niveau > a.niveau ? b : a));

    let situation = null;
    if (derniere.niveau_m_ngf !== null) {
      const moisDerniere = derniere.date.slice(5, 7);
      const reference = valides.filter((m) => m.date.slice(5, 7) === moisDerniere);
      if (reference.length >= NB_REFERENCE_MIN) {
        const nbInferieurs = reference.filter((m) => m.niveau < derniere.niveau_m_ngf).length;
        const percentile = nbInferieurs / reference.length;
        const seuil = SEUILS_SITUATION.find((s) => percentile < s.max) ?? SEUILS_SITUATION[SEUILS_SITUATION.length - 1];
        situation = { classe: seuil.classe, libelle: seuil.libelle, percentile, nbReference: reference.length };
      }
    }

    return {
      derniere,
      min: { date: min.date, niveau_m_ngf: min.niveau },
      max: { date: max.date, niveau_m_ngf: max.niveau },
      nb: valides.length,
      debut: mesures[0].date,
      fin: derniereMesure.date,
      situation,
    };
  }

  // Décime en gardant le min et le max de chaque tranche (préserve les pics, ex. crue) au lieu
  // d'un pas fixe qui pourrait les manquer.
  function decimerMinMax(points, nbBuckets) {
    if (points.length <= nbBuckets * 2) return points;
    const xMin = points[0].x;
    const xMax = points[points.length - 1].x;
    const largeur = (xMax - xMin) / nbBuckets || 1;
    const resultat = [];
    let i = 0;
    for (let b = 0; b < nbBuckets; b++) {
      const limite = xMin + (b + 1) * largeur;
      const bucket = [];
      while (i < points.length && (b === nbBuckets - 1 ? points[i].x <= xMax : points[i].x < limite)) {
        bucket.push(points[i]);
        i++;
      }
      if (bucket.length === 0) continue;
      if (bucket.length === 1) {
        resultat.push(bucket[0]);
        continue;
      }
      const min = bucket.reduce((a, c) => (c.y < a.y ? c : a));
      const max = bucket.reduce((a, c) => (c.y > a.y ? c : a));
      if (bucket.indexOf(min) <= bucket.indexOf(max)) resultat.push(min, max);
      else resultat.push(max, min);
    }
    return resultat;
  }

  function serieVersChemin(mesures) {
    const valides = mesures
      .filter((m) => m.niveau_m_ngf !== null)
      .map((m) => ({ x: Date.parse(m.date), y: Number(m.niveau_m_ngf), date: m.date }));
    const points = decimerMinMax(valides, 120);
    if (points.length < 2) return null;

    const MARGES = { gauche: 40, droite: 10, haut: 10, bas: 30 };
    const L = 300;
    const H = 130;
    const W = L - MARGES.gauche - MARGES.droite;
    const HChart = H - MARGES.haut - MARGES.bas;

    const xs = points.map((p) => p.x);
    const xMin = Math.min(...xs);
    const xSpan = Math.max(...xs) - xMin || 1;
    const valeurs = points.map((p) => p.y);
    const yMin = Math.min(...valeurs);
    const yMax = Math.max(...valeurs);
    const ySpan = yMax - yMin || 1;

    const mapped = points.map((p) => ({
      x: MARGES.gauche + ((p.x - xMin) / xSpan) * W,
      y: MARGES.haut + HChart - ((p.y - yMin) / ySpan) * HChart,
      date: p.date,
      niveau: p.y,
    }));

    const line = mapped.map((p, i) => `${i === 0 ? "M" : "L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
    const area =
      line +
      ` L${mapped[mapped.length - 1].x.toFixed(1)},${MARGES.haut + HChart}` +
      ` L${mapped[0].x.toFixed(1)},${MARGES.haut + HChart} Z`;

    const ticksY = 4;
    const yTickVals = [];
    for (let i = 0; i <= ticksY; i++) {
      const val = yMin + (ySpan * i) / ticksY;
      yTickVals.push({
        y: MARGES.haut + HChart - (i / ticksY) * HChart,
        label: `${val.toFixed(1)} m`,
      });
    }

    const ticksX = 3;
    const xTickVals = [];
    for (let i = 0; i <= ticksX; i++) {
      const idx = Math.round((i / ticksX) * (mapped.length - 1));
      const p = mapped[idx];
      const d = new Date(p.date);
      const label = `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear().toString().slice(2)}`;
      xTickVals.push({ x: p.x, label });
    }

    return { line, area, mapped, yTickVals, xTickVals, yMin, yMax };
  }

  function dessinerGrille(grilleEl, yTickVals, MARGES, W, HChart) {
    grilleEl.innerHTML = "";
    yTickVals.forEach((tick) => {
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", MARGES.gauche);
      line.setAttribute("x2", MARGES.gauche + W);
      line.setAttribute("y1", tick.y);
      line.setAttribute("y2", tick.y);
      line.setAttribute("stroke", "var(--border)");
      line.setAttribute("stroke-opacity", "0.35");
      line.setAttribute("stroke-dasharray", "2 2");
      grilleEl.appendChild(line);
    });
  }

  function dessinerAxes(axesXEl, axesYEl, xTickVals, yTickVals, MARGES, HChart) {
    axesXEl.innerHTML = "";
    axesYEl.innerHTML = "";

    xTickVals.forEach((tick) => {
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", tick.x);
      text.setAttribute("y", MARGES.haut + HChart + 14);
      text.setAttribute("text-anchor", "middle");
      text.textContent = tick.label;
      axesXEl.appendChild(text);
    });

    yTickVals.forEach((tick) => {
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", MARGES.gauche - 6);
      text.setAttribute("y", tick.y + 3);
      text.setAttribute("text-anchor", "end");
      text.textContent = tick.label;
      axesYEl.appendChild(text);
    });
  }

  function formaterDateCourte(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" });
  }

  function formaterMois(iso) {
    return new Date(iso).toLocaleDateString("fr-FR", { month: "long" });
  }

  function formaterNiveau(v) {
    return v === null || v === undefined ? "—" : `${Number(v).toLocaleString("fr-FR", { maximumFractionDigits: 1 })} m NGF`;
  }

  // profondeur_nappe (Hub'Eau) peut être négative : la nappe est alors au-dessus du repère de
  // mesure (station en zone de source/artésienne), pas forcément « sous le sol ».
  function formaterProfondeur(v) {
    if (v === null || v === undefined) return "";
    const abs = Math.abs(Number(v)).toLocaleString("fr-FR", { maximumFractionDigits: 1 });
    return v < 0 ? `${abs} m au-dessus du repère` : `${abs} m sous le repère`;
  }

  const els = {
    titre: document.getElementById("titre"),
    etatChargement: document.getElementById("etat-chargement"),
    dlAltitude: document.getElementById("dl-altitude"),
    valeurAltitude: document.getElementById("valeur-altitude"),
    blocStats: document.getElementById("bloc-stats"),
    niveauActuel: document.getElementById("niveau-actuel"),
    profondeurActuelle: document.getElementById("profondeur-actuelle"),
    dateDerniere: document.getElementById("date-derniere"),
    blocSituation: document.getElementById("bloc-situation"),
    pastilleSituation: document.getElementById("pastille-situation"),
    texteSituation: document.getElementById("texte-situation"),
    minmax: document.getElementById("minmax"),
    graphe: document.getElementById("graphe"),
    cheminGraphe: document.getElementById("chemin-graphe"),
    aireGraphe: document.getElementById("aire-graphe"),
    grille: document.getElementById("grille"),
    axesX: document.getElementById("axes-x"),
    axesY: document.getElementById("axes-y"),
    dernierPoint: document.getElementById("dernier-point"),
    legendeGraphe: document.getElementById("legende-graphe"),
    boutonActualiser: document.getElementById("bouton-actualiser"),
    horodatage: document.getElementById("horodatage"),
  };

  async function charger() {
    els.boutonActualiser.disabled = true;
    els.etatChargement.hidden = false;
    els.etatChargement.textContent = "Chargement…";
    els.etatChargement.classList.remove("erreur");
    els.dlAltitude.hidden = true;
    els.blocStats.hidden = true;
    els.graphe.hidden = true;
    els.legendeGraphe.textContent = "";

    try {
      let mesuresHistorique = [];
      try {
        const repHistorique = await fetch("./data/historique-valleraugue.json");
        if (repHistorique.ok) {
          mesuresHistorique = await repHistorique.json();
        }
      } catch {
        console.warn("Historique local indisponible, chargement complet depuis l'API");
      }

      const [reponseStation, mesuresBrutes] = await Promise.all([
        fetch(
          `https://hubeau.eaufrance.fr/api/v1/niveaux_nappes/stations?code_bss=${encodeURIComponent(CODE_BSS)}&format=json`,
        ).then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        }),
        fetchAllHubeau(
          `https://hubeau.eaufrance.fr/api/v1/niveaux_nappes/chroniques?code_bss=${encodeURIComponent(CODE_BSS)}&format=json&date_debut_mesure=2026-01-01&size=5000`,
        ),
      ]);

      const station = reponseStation.data && reponseStation.data[0];
      if (!station) throw new Error("station introuvable");

      els.titre.textContent = station.libelle_pe || station.nom_commune;
      els.valeurAltitude.textContent = `${Number(station.altitude_station).toLocaleString("fr-FR", { maximumFractionDigits: 1 })} m`;
      els.dlAltitude.hidden = false;

      const serie = [
        ...mesuresHistorique.map((m) => ({ date: m.date_mesure, niveau_m_ngf: m.niveau_nappe_eau, profondeur_m: m.profondeur_nappe })),
        ...mesuresBrutes.map((m) => ({ date: m.date_mesure, niveau_m_ngf: m.niveau_nappe_eau, profondeur_m: m.profondeur_nappe })),
      ]
        .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

      const stats = calculerStats(serie);
      if (!stats) throw new Error("aucune mesure exploitable");

      els.niveauActuel.textContent = formaterNiveau(stats.derniere.niveau_m_ngf);
      if (stats.derniere.profondeur_m !== null) {
        els.profondeurActuelle.textContent = `(nappe à ${formaterProfondeur(stats.derniere.profondeur_m)})`;
        els.profondeurActuelle.hidden = false;
      } else {
        els.profondeurActuelle.hidden = true;
      }
      els.dateDerniere.textContent = `le ${formaterDateCourte(stats.derniere.date)}`;

      if (stats.situation) {
        els.pastilleSituation.style.background = COULEUR_SITUATION[stats.situation.classe];
        els.texteSituation.textContent = `niveau ${stats.situation.libelle} pour un mois de ${formaterMois(stats.derniere.date)}`;
        els.blocSituation.hidden = false;
      } else {
        els.blocSituation.hidden = true;
      }

      els.minmax.textContent =
        `plus bas ${formaterNiveau(stats.min.niveau_m_ngf)} (${formaterDateCourte(stats.min.date)}) · ` +
        `plus haut ${formaterNiveau(stats.max.niveau_m_ngf)} (${formaterDateCourte(stats.max.date)})`;

      els.blocStats.hidden = false;

      const grapheData = serieVersChemin(serie);
      if (grapheData) {
        const MARGES = { gauche: 40, droite: 10, haut: 10, bas: 30 };
        const W = 300 - MARGES.gauche - MARGES.droite;
        const HChart = 130 - MARGES.haut - MARGES.bas;

        els.cheminGraphe.setAttribute("d", grapheData.line);
        els.aireGraphe.setAttribute("d", grapheData.area);
        dessinerGrille(els.grille, grapheData.yTickVals, MARGES, W, HChart);
        dessinerAxes(els.axesX, els.axesY, grapheData.xTickVals, grapheData.yTickVals, MARGES, HChart);

        const dernier = grapheData.mapped[grapheData.mapped.length - 1];
        els.dernierPoint.setAttribute("cx", dernier.x);
        els.dernierPoint.setAttribute("cy", dernier.y);

        els.graphe.hidden = false;
      }
      els.legendeGraphe.textContent = `${formaterDateCourte(stats.debut)} → ${formaterDateCourte(stats.fin)} (${stats.nb.toLocaleString("fr-FR")} mesures)`;

      els.etatChargement.hidden = true;
      els.horodatage.textContent = `Actualisé à ${new Date().toLocaleTimeString("fr-FR")} — données Hub'Eau en direct`;
    } catch (err) {
      console.error("chronique piézo indisponible", err);
      els.etatChargement.hidden = false;
      els.etatChargement.textContent = "Données temporairement indisponibles (Hub'Eau injoignable).";
      els.etatChargement.classList.add("erreur");
    } finally {
      els.boutonActualiser.disabled = false;
    }
  }

  els.boutonActualiser.addEventListener("click", charger);
  charger();
</script>
</body>
</html>
